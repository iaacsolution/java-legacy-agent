# Source de données PostgreSQL/TimescaleDB du flight recorder.
#
# Versionnée en fichier — et non créée à la main dans l'UI Grafana — pour qu'une
# perte du volume grafana_data ne l'efface plus. Une source créée dans l'UI ne
# vit que dans la base interne de Grafana ; celle-ci est recréée à chaque
# démarrage depuis ce fichier.
#
# Identifiants : compte EN LECTURE SEULE, distinct de celui de l'enregistreur.
# Grafana ne détient pas les droits d'écriture — voir README, section
# « Flight recorder », pour la création du compte. Aucun secret n'est écrit ici :
# les valeurs viennent de l'environnement du conteneur Grafana
# (GRAFANA_PG_USER / GRAFANA_PG_PASSWORD, à définir dans .env).
#
# ATTENTION à la syntaxe : Grafana n'interpole que $VAR et ${VAR}. La forme
# ${VAR:-défaut} n'est PAS comprise et se résout à vide — c'est ce qui produisait
# l'erreur « no PostgreSQL user name specified ». Ne jamais mettre de valeur par
# défaut ici.

apiVersion: 1

datasources:
  - name: Flight recorder (legacyrec)
    uid: flightrec-legacyrec
    type: postgres
    access: proxy
    # Conteneur local existant. Pour le profil compose, utiliser timescaledb:5432.
    url: host.docker.internal:5432
    database: legacyrec
    user: ${GRAFANA_PG_USER}
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1800
      # Active les fonctions d'agrégat TimescaleDB dans l'éditeur de requêtes.
      timescaledb: true
    editable: false
